version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ipc-bns-backend
    ports:
      - "8000:8000"  # Expose for local development
    volumes:
      - ./backend/app:/app/app
      - backend-data:/app/data
      - chroma-db:/app/chroma_db
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///./data/legal_reasoning.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ipc-bns-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ipc-bns-frontend
    ports:
      - "3000:80"  # Expose for local development
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ipc-bns-network

  nginx:
    image: nginx:alpine
    container_name: ipc-bns-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - ipc-bns-network
    command: >
      /bin/sh -c "envsubst '$$DOMAIN_NAME' < /etc/nginx/templates/app-http-only.conf.template > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    container_name: ipc-bns-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - ipc-bns-network

volumes:
  backend-data:
    driver: local
  chroma-db:
    driver: local
  nginx-cache:
    driver: local

networks:
  ipc-bns-network:
    driver: bridge
